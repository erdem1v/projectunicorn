<!doctype html><html lang="tr"><head><meta charset="utf-8"><title>Acilis</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans+Condensed:wght@400&family=IBM+Plex+Sans:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=block" rel="stylesheet"><link rel="stylesheet" href="../../../system/tokens.css"><link rel="stylesheet" href="../../../system/base.css"><link rel="stylesheet" href="../../kabuk/kabuk.css"><link rel="stylesheet" href="../modallar.css"></head><body><div class="onb"><div class="gate-c"><span class="brand lg"><i></i>Project Unicorn</span><div class="gate-opts"><div class="lang-opt is-focus"><span class="t">Türkçe</span><span class="s">Oyuna Türkçe başla</span></div><div class="lang-opt"><span class="t">English</span><span class="s">Start the game in English</span></div></div></div></div><script>
document.querySelectorAll('[data-pop-for]').forEach(function (p) {
  var a = document.getElementById(p.dataset.popFor).getBoundingClientRect();
  p.style.left = a.left + 'px'; p.style.top = (a.bottom + 4) + 'px'; p.style.width = a.width + 'px';
  var tip = p.querySelector('.tip[data-tip-for]');
  if (tip) { var r = document.getElementById(tip.dataset.tipFor).getBoundingClientRect();
    tip.style.left = (a.width + 8) + 'px'; tip.style.top = (r.top - a.bottom - 4) + 'px'; }
});
